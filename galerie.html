<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAITTERS ESPORTS — Galerie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- HLAVIČKA -->
<header class="top-header">
  <div class="logo-box">
    <img src="1.png" alt="BAITTERS Logo">
  </div>
  <div class="title-box">
    <h1>BAITTERS</h1>
    <p>CZ / SK Esport Organizace</p>
  </div>
</header>
<!-- NAVIGACE -->
<nav class="nav">
  <a href="index.html">Home</a>
  <a href="onas.html">O nás</a>
  <a href="tym.html">Náš tým</a>
  <a href="zapasy.html">Zápasy</a>
  <a href="galerie.html" class="active">Galerie</a>
  <a href="kontakt.html">Kontakt</a>
</nav>
<!-- HLAVNÍ OBSAH -->
<section class="main-content">
  <h2>Galerie</h2>
  <div class="content-box">
    <h3>Fotografie z akcí</h3>
    <p>Fotografie z našich akcí, turnajů a tréninků.</p>
  </div>
  <div class="gallery-grid">
    <div class="gallery-item"><img src="3.png" alt="BAITTERS tým" style="width:100%; height:100%; object-fit:cover; cursor:pointer;" onclick="openLightbox('3.png')"></div>
    <div class="gallery-item"><img src="4.png" alt="BAITTERS turnaj" style="width:100%; height:100%; object-fit:cover; cursor:pointer;" onclick="openLightbox('4.png')"></div>
    <div class="gallery-item">📷</div>
    <div class="gallery-item">📷</div>
    <div class="gallery-item">📷</div>
    <div class="gallery-item">📷</div>
  </div>
</section>
<!-- FOOTER -->
<footer class="footer">
  <div class="footer-brand"><span>BAIT</span>TERS</div>
  <p>&copy; 2025 BAITTERS. Všechna práva vyhrazena.</p>
  <p>Kontakt: <a href="mailto:info@baitters.cz">info@baitters.cz</a></p>
</footer>

<!-- LIGHTBOX -->
<div id="lightbox-overlay" onclick="closeLightbox()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; align-items:center; justify-content:center; cursor:zoom-out;">
  <span onclick="closeLightbox()" style="position:absolute; top:20px; right:35px; color:#fff; font-size:40px; font-weight:bold; cursor:pointer; line-height:1;">&times;</span>
  <img id="lightbox-img" src="" alt="Zvětšená fotografie" style="max-width:90%; max-height:90%; border-radius:8px;">
</div>

<script>
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-overlay').style.display = 'flex';
  }
  function closeLightbox() {
    document.getElementById('lightbox-overlay').style.display = 'none';
  }
</script>

</body>
</html>
