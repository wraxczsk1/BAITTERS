<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>BAITTERS – Turnaje</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HLAVIČKA -->
<header class="top-header">
  <div class="header-left">
    <img src="1.png" class="header-logo" alt="BAITTERS Logo">
    <a href="index.html" class="header-name">BAITTERS</a>
  </div>
</header>

<!-- NAVIGACE -->
<nav class="nav">
  <a href="index.html">Home</a>
  <a href="onas.html">O nás</a>
  <a href="tym.html">Náš tým</a>
  <a href="kontakt.html">Kontakt</a>
  <a href="turnaj.html" class="active">Turnaj</a>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1><span>BAITTERS TURNAMENTS</span></h1>
    <p>Vyber si turnaj a sestav svůj pick’em.</p>
  </div>
</section>

<!-- TURNOVÉ BANNERY -->
<div class="tournaments-wrapper">

  <!-- MČB -->
  <div class="tournament-banner">
    <div class="tournament-left">
      <div class="tournament-icon">MČB</div>
      <div class="tournament-text">
        <h3>MČB</h3>
        <p>Oficiální turnaj – pickni vítěze.</p>
      </div>
    </div>
    <button class="tournament-btn" data-open="mcb">Otevřít pick'em</button>
  </div>

  <!-- PLAYZONE -->
  <div class="tournament-banner">
    <div class="tournament-left">
      <div class="tournament-icon">PZ</div>
      <div class="tournament-text">
        <h3>PLAYZONE</h3>
        <p>Pick’em pro PLAYZONE turnaj.</p>
      </div>
    </div>
    <button class="tournament-btn" data-open="playzone">Otevřít pick'em</button>
  </div>

  <!-- COMPLAY -->
  <div class="tournament-banner">
    <div class="tournament-left">
      <div class="tournament-icon">CP</div>
      <div class="tournament-text">
        <h3>COMPLAY</h3>
        <p>Pick’em pro COMPLAY turnaj.</p>
      </div>
    </div>
    <button class="tournament-btn" data-open="complay">Otevřít pick'em</button>
  </div>

</div>

<!-- PICK'EM ŠABLONA -->
<section id="pickem-template" style="display:none;">
  <h2 class="pickem-title"></h2>

  <table class="pickem-table">
    <tr>
      <th>3‑0</th>
      <th>Postupující</th>
      <th>0‑3</th>
    </tr>
    <tr>
      <td class="pickem-slot" data-slot="3-0"></td>
      <td class="pickem-slot" data-slot="adv"></td>
      <td class="pickem-slot" data-slot="0-3"></td>
    </tr>
    <tr>
      <td></td>
      <td class="pickem-slot" data-slot="adv"></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td class="pickem-slot" data-slot="adv"></td>
      <td></td>
    </tr>
  </table>

  <div class="team-list"></div>

  <button class="save-btn">ULOŽIT PICK'EM</button>
  <div class="msg"></div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-logo">
    <img src="1.png" alt="BAITTERS Logo">
  </div>
  <div class="footer-bottom">
    <p>© 2025 BAITTERS ESPORT</p>
  </div>
</footer>

<script>
/* TÝMY PRO VŠECHNY TURNAJE */
const TEAMS = ["SINNERS", "ENTERPRISE", "Dynamo Eclot", "Cryptova"];

/* OTEVŘENÍ PICK'EM */
document.querySelectorAll(".tournament-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const id = btn.dataset.open;
    openPickem(id);
  });
});

function openPickem(id) {
  const template = document.getElementById("pickem-template");
  template.style.display = "block";

  template.querySelector(".pickem-title").textContent =
    id.toUpperCase() + " – PICK'EM";

  const teamList = template.querySelector(".team-list");
  teamList.innerHTML = "";
  TEAMS.forEach(t => {
    const div = document.createElement("div");
    div.className = "team-btn";
    div.draggable = true;
    div.textContent = t;
    teamList.appendChild(div);
  });

  initPickem(template, id);
  window.scrollTo({ top: template.offsetTop - 20, behavior: "smooth" });
}

/* PICK'EM LOGIKA */
function initPickem(section, key) {
  let dragged = null;

  const slots = section.querySelectorAll(".pickem-slot");
  const pool = section.querySelector(".team-list");
  const msg = section.querySelector(".msg");
  const saveBtn = section.querySelector(".save-btn");

  function attachDrag(btn) {
    btn.addEventListener("dragstart", () => {
      dragged = btn;
      btn.classList.add("dragging");
    });
    btn.addEventListener("dragend", () => {
      btn.classList.remove("dragging");
      dragged = null;
    });
  }

  section.querySelectorAll(".team-btn").forEach(attachDrag);

  slots.forEach(slot => {
    slot.addEventListener("dragover", e => {
      e.preventDefault();
      slot.classList.add("drag-over");
    });

    slot.addEventListener("dragleave", () => {
      slot.classList.remove("drag-over");
    });

    slot.addEventListener("drop", () => {
      slot.classList.remove("drag-over");
      if (!dragged) return;

      for (let s of slots) {
        if (s.textContent.trim() === dragged.textContent.trim()) return;
      }

      if (slot.textContent.trim() !== "") {
        const old = document.createElement("div");
        old.className = "team-btn";
        old.draggable = true;
        old.textContent = slot.textContent.trim();
        pool.appendChild(old);
        attachDrag(old);
      }

      slot.textContent = dragged.textContent.trim();
      dragged.remove();
    });

    slot.addEventListener("click", () => {
      if (slot.textContent.trim() !== "") {
        const old = document.createElement("div");
        old.className = "team-btn";
        old.draggable = true;
        old.textContent = slot.textContent.trim();
        pool.appendChild(old);
        attachDrag(old);
        slot.textContent = "";
      }
    });
  });

  /* ULOŽENÍ */
  saveBtn.onclick = () => {
    const data = {
      slots: Array.from(slots).map(s => s.textContent.trim()),
      pool: Array.from(pool.querySelectorAll(".team-btn")).map(b => b.textContent.trim())
    };
    localStorage.setItem("pickem-" + key, JSON.stringify(data));
    msg.textContent = "Pick'em uložen!";
    setTimeout(() => msg.textContent = "", 2500);
  };

  /* NAČTENÍ */
  const saved = localStorage.getItem("pickem-" + key);
  if (saved) {
    const data = JSON.parse(saved);

    slots.forEach((s, i) => s.textContent = data.slots[i] || "");
    pool.innerHTML = "";

    data.pool.forEach(name => {
      const btn = document.createElement("div");
      btn.className = "team-btn";
      btn.draggable = true;
      btn.textContent = name;
      pool.appendChild(btn);
      attachDrag(btn);
    });
  }
}
</script>

</body>
</html>
