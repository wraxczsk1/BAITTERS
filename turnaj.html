<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>BAITTERS CUP – Pick'em</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pickem-table {
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      border-collapse: collapse;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      overflow: hidden;
    }

    .pickem-table th {
      background: #0d0f18;
      padding: 14px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--red);
      font-size: 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .pickem-table td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid var(--border-soft);
      color: var(--text-main);
      font-size: 15px;
    }

    .team-list {
      max-width: 900px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }

    .team-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-main);
    }

    .team-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .save-btn {
      display: block;
      margin: 30px auto;
      padding: 12px 30px;
      background: var(--red);
      border: none;
      border-radius: 999px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.1em;
    }

    .save-btn:hover {
      background: var(--red-soft);
    }

    .msg {
      text-align: center;
      margin-top: 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header class="top-header">
  <div class="header-left">
    <img src="1.png" class="header-logo">
    <a href="index.html" class="header-name">BAITTERS</a>
  </div>
</header>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="onas.html">O nás</a>
  <a href="tym.html">Náš tým</a>
  <a href="kontakt.html">Kontakt</a>
  <a href="turnaj.html" class="active">Turnaj</a>
</nav>

<section class="hero hero-cup">
  <div class="hero-content">
    <h1><span>BAITTERS PICK'EM</span></h1>
    <p>Klikni na tým a vlož ho do tabulky.</p>
  </div>
</section>

<!-- PICKEM TABULKA -->
<table class="pickem-table">
  <tr>
    <th>3‑0</th>
    <th>Postupující</th>
    <th>0‑3</th>
  </tr>
  <tr>
    <td id="slot-3-0-1"></td>
    <td id="slot-adv-1"></td>
    <td id="slot-0-3-1"></td>
  </tr>
  <tr>
    <td id="slot-3-0-2"></td>
    <td id="slot-adv-2"></td>
    <td id="slot-0-3-2"></td>
  </tr>
  <tr>
    <td></td>
    <td id="slot-adv-3"></td>
    <td></td>
  </tr>
  <tr>
    <td></td>
    <td id="slot-adv-4"></td>
    <td></td>
  </tr>
  <tr>
    <td></td>
    <td id="slot-adv-5"></td>
    <td></td>
  </tr>
  <tr>
    <td></td>
    <td id="slot-adv-6"></td>
    <td></td>
  </tr>
</table>

<!-- TÝMY -->
<div class="team-list">
  <div class="team-btn" data-team="GamerLegion">GamerLegion</div>
  <div class="team-btn" data-team="NRG">NRG</div>
  <div class="team-btn" data-team="Sharks">Sharks</div>
  <div class="team-btn" data-team="BetBoom">BetBoom</div>
  <div class="team-btn" data-team="M80">M80</div>
  <div class="team-btn" data-team="FlyQuest">FlyQuest</div>
  <div class="team-btn" data-team="SINNERS">SINNERS</div>
  <div class="team-btn" data-team="BIG">BIG</div>
</div>

<button class="save-btn" id="save">ULOŽIT PICK'EM</button>
<div class="msg" id="msg"></div>

<script>
  const slots = document.querySelectorAll("td[id]");
  const teams = document.querySelectorAll(".team-btn");
  const msg = document.getElementById("msg");

  teams.forEach(btn => {
    btn.addEventListener("click", () => {
      const team = btn.dataset.team;

      // najdi první prázdné místo
      for (let slot of slots) {
        if (slot.textContent.trim() === "") {
          slot.textContent = team;
          return;
        }
      }
    });
  });

  // kliknutím na slot ho vymažeš
  slots.forEach(slot => {
    slot.addEventListener("click", () => {
      slot.textContent = "";
    });
  });

  document.getElementById("save").addEventListener("click", () => {
    const data = {};

    slots.forEach(slot => {
      data[slot.id] = slot.textContent.trim();
    });

    msg.textContent = "Pick'em uložen (zatím jen lokálně).";
  });
</script>

</body>
</html>
