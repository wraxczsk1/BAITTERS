<section class="hero-section">
  <div class="hero-content">
    <h2 class="hero-big">Zápasy</h2>
    <p>Výsledky, statistiky a nadcházející utkání BAITTERS</p>
  </div>
</section>

<section class="main-content">

  <!-- Nadcházející zápasy -->
  <div class="content-box">
    <h3>Nadcházející zápasy</h3>

    <table class="matches-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Soupeř</th>
          <th>Typ zápasu</th>
          <th>Stav</th>
          <th>Poznámka</th>
        </tr>
      </thead>
      <tbody id="upcoming-matches"></tbody>
    </table>
  </div>

  <!-- Poslední zápasy -->
  <div class="content-box">
    <h3>Poslední zápasy</h3>

    <table class="matches-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Soupeř</th>
          <th>Typ zápasu</th>
          <th>Skóre</th>
          <th>Poznámka</th>
        </tr>
      </thead>
      <tbody id="finished-matches"></tbody>
    </table>
  </div>


  <script>
fetch("matches.json")
  .then(response => response.json())
  .then(data => {
    
    // Nadcházející zápasy
    const upcomingTable = document.getElementById("upcoming-matches");
    data.upcoming.forEach(match => {
      upcomingTable.innerHTML += `
        <tr>
          <td>${match.date}</td>
          <td>${match.opponent}</td>
          <td>${match.type}</td>
          <td>${match.status}</td>
          <td>${match.note}</td>
        </tr>
      `;
    });

    // Poslední zápasy
    const finishedTable = document.getElementById("finished-matches");
    data.finished.forEach(match => {
      const scoreClass = match.score.split(":")[0] > match.score.split(":")[1]
        ? "score-win"
        : "score-loss";

      finishedTable.innerHTML += `
        <tr>
          <td>${match.date}</td>
          <td>${match.opponent}</td>
          <td>${match.type}</td>
          <td><span class="${scoreClass}">${match.score}</span></td>
          <td>${match.note}</td>
        </tr>
      `;
    });

  });
</script>


</section>
