<section class="hero-section">
  <div class="text-block">
    <img src="1.png" class="onas-logo">
    <h2>KONTAKT NA NÁS</h2>
    <p>Napište nám nebo nás kontaktujte přes sociální sítě.</p>
  </div>
</section>

<section class="main-content">

  <div class="contact-section">

    <!-- LEVÁ STRANA -->
    <div class="contact-box">
      <h3>Kontakt</h3>

      <!-- Instagram -->
      <a href="https://www.instagram.com/baitters_cs/" target="_blank" class="contact-btn">
        <img src="icons/ig.png" alt="Instagram">
        Instagram
      </a>

      <!-- Email -->
      <a href="mailto:info@baitters.cz" class="contact-btn">
        <img src="icons/mail.png" alt="Email">
        Email
      </a>

      <!-- Discord -->
      <a href="https://discord.gg/kzWwqVVT" target="_blank" class="contact-btn">
        <img src="icons/discord.png" alt="Discord">
        Discord
      </a>
    </div>

    <!-- PRAVÁ STRANA -->
    <div class="contact-box">
      <h3>Napište nám</h3>
      <form class="contact-form">
        <input type="text" placeholder="Vaše jméno" required>
        <input type="email" placeholder="Email" required>
        <textarea rows="5" placeholder="Zpráva" required></textarea>
        <button class="btn-red">Odeslat</button>
      </form>
    </div>

  </div>

</section>
