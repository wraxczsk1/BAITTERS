<!-- HLAVNÍ OBSAH -->
<section class="main-content">
  <h2>Kontaktuj nás</h2>

  <div class="contact-section">

    <div class="contact-box">
      <h3>
        <svg width="18" height="18" fill="none" stroke="#e02020" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Email
      </h3>
      <p><a href="mailto:info@baitters.cz">info@baitters.cz</a></p>
    </div>

    <div class="contact-box">
      <h3>
        <svg width="18" height="18" fill="none" stroke="#e02020" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Sociální sítě
      </h3>
      <p style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
        <a href="#" target="_blank">Discord</a>
        <a href="#" target="_blank">Twitch</a>
        <a href="#" target="_blank">Instagram</a>
        <a href="#" target="_blank">YouTube</a>
      </p>
    </div>

    <div class="contact-box">
      <h3>
        <svg width="18" height="18" fill="none" stroke="#e02020" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Formulář
      </h3>
      <form class="contact-form">
        <input type="text" placeholder="Tvoje jméno" required>
        <input type="email" placeholder="Tvůj email" required>
        <textarea placeholder="Tvoje zpráva" rows="5" required></textarea>
        <button type="submit" class="btn btn-primary">Odeslat zprávu</button>
      </form>
    </div>

  </div>
</section>
